<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Fotografije po tagu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<header>
    <h1 th:text="'Fotografije za tag: ' + ${tag.name}">Fotografije</h1>
</header>

<div th:if="${#lists.isEmpty(photos)}">
    <p>Nema fotografija s ovim tagom.</p>
</div>

<div th:if="${!#lists.isEmpty(photos)}">
    <ul>
        <li th:each="p : ${photos}">
            <strong th:text="${p.title}">Naslov</strong>
            <span> - </span>
            <span th:text="${p.description}">Opis</span>
        </li>
    </ul>
</div>

<a th:href="@{/tags}" class="btn">← Nazad na tagove</a>
</body>
</html>
