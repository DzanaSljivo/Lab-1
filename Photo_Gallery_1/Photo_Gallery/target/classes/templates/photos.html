<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Sve Fotografije</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<header>
    <h1>📷 Sve Fotografije</h1>
    <p>Pregledajte sve predivne trenutke zabilježene u našoj galeriji. Kliknite za upravljanje albumima ili uklanjanje fotografija.</p>
    <a th:href="@{/albums}" class="btn">← Nazad na Albume</a>
</header>

<div class="photos-grid">
    <div class="photo-card" th:each="p : ${photos}">
        <div class="photo-img-wrapper">
            <img th:src="@{'/images/' + ${p.imageUrl}}" alt="Fotografija" class="photo-img" />
            <div class="overlay">
                <p th:text="${p.available} ? 'Dostupna' : 'Dodana u ' + ${p.album != null ? p.album.title : ''}"></p>
                <form th:if="${p.album != null}" th:action="@{/photos/remove}" method="post">
                    <input type="hidden" name="photoId" th:value="${p.id}">
                    <input type="hidden" name="albumId" th:value="${p.album.id}">
                    <button type="submit" class="btn">Ukloni</button>
                </form>
            </div>
        </div>

        <h3 th:text="${p.title}"></h3>

        <!-- 🔹 PRIKAZ TAGOVA ZA FOTOGRAFIJU -->
        <div class="tags-container">
            <span class="tag-badge"
                  th:each="t : ${p.tags}"
                  th:text="${t.name}">
            </span>

            <!-- Ako nema tagova -->
            <span th:if="${#lists.isEmpty(p.tags)}">Nema tagova</span>
        </div>

        <!-- 🔹 DUGME ZA DODAVANJE TAGA NA OVU FOTOGRAFIJU -->
        <a th:href="@{'/tags/addToPhoto/' + ${p.id}}" class="btn-small">
            ➕ Dodaj tag
        </a>
    </div>
</div>
</body>
</html>
